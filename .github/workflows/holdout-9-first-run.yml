name: Holdout 9 First Run

on:
  push:
    branches:
      - test/holdout-external-9
    paths:
      - benchmarks/holdout-external-9.json
      - .github/workflows/holdout-9-first-run.yml

jobs:
  first-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/holdout-external-9

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen Token Saver revision
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen ground truth before cloning repositories
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from token_saver.evaluate import ground_truth_hash

          path = Path("benchmarks/holdout-external-9.json")
          payload = json.loads(path.read_text())
          expected = payload["protocol"]["ground_truth_sha256"]
          actual = ground_truth_hash(payload)
          print("DECLARED", expected)
          print("ACTUAL  ", actual)
          assert actual == expected, (actual, expected)
          assert payload["protocol"]["ground_truth_frozen"] is True
          assert payload["protocol"]["development_excluded"] is True
          print("GROUND_TRUTH_VERIFIED")
          PY

      - name: Clone pinned untouched repositories
        run: |
          set -euo pipefail
          clone_at() {
            repo="$1"
            sha="$2"
            dest="$3"
            git init -q "$dest"
            git -C "$dest" remote add origin "https://github.com/$repo.git"
            git -C "$dest" fetch -q --depth=1 origin "$sha"
            git -C "$dest" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$sha"
          }
          clone_at NLog/NLog 5e60d28d428c044ae5d6b36bf8875ec7370cf046 NLog
          clone_at FluentAssertions/FluentAssertions e5349243870e70b36945af6bf10ab3b64e768a13 FluentAssertions
          clone_at ben-manes/caffeine c0edd00bb6063e59ee1e7a7db5588fac7a6524f5 caffeine
          clone_at apache/commons-lang 8c730822620f2e5a9e7e64443483127f438e51b7 commons-lang
          clone_at typeorm/typeorm b1eafc23d8d695a2e2f4ebe9063d9a0c92415d1d typeorm
          clone_at typestack/class-transformer a2734a5d154c9b0beb9a10555a04416bc371de06 class-transformer
          clone_at tokio-rs/tokio cf782c5b917b7ea21b6f97f07104ebf16d35f5f8 tokio
          clone_at sirupsen/logrus 6d6a132bc03324d4ceb78e1b927f995d014cda20 logrus

      - name: Run holdout exactly once
        run: |
          token-saver evaluate benchmarks/holdout-external-9.json \
            --path . \
            --max-tokens 6000 \
            --require-holdout > /tmp/holdout-external-9.result.json
          echo "===== HOLDOUT_9_RESULT_BEGIN ====="
          cat /tmp/holdout-external-9.result.json
          echo "===== HOLDOUT_9_RESULT_END ====="

      - uses: actions/upload-artifact@v4
        with:
          name: holdout-9-first-run
          path: /tmp/holdout-external-9.result.json
          if-no-files-found: error
