name: Holdout 8 First Run

on:
  push:
    branches:
      - test/holdout-external-8

jobs:
  holdout-8:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/holdout-external-8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Verify frozen ground truth before cloning repositories
        shell: bash
        run: |
          set -euo pipefail
          expected="ea638a0cf9a5777ac5799982a728b6f895aaa952cf7b9f04a714991650c0d7ab"
          actual="$(token-saver evaluate benchmarks/holdout-external-8.json --print-ground-truth-hash)"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$actual" = "$expected"

      - name: Clone pinned untouched repositories
        shell: bash
        run: |
          set -euo pipefail
          clone_at() {
            url="$1"
            dir="$2"
            sha="$3"
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch -q --depth=1 origin "$sha"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          }

          clone_at https://github.com/FluentValidation/FluentValidation.git benchmarks/FluentValidation fa9787a0d4fd0c0b99f9682292d76d5ad97ba6cb
          clone_at https://github.com/App-vNext/Polly.git benchmarks/Polly 9a81fdc7c1a89d6c45bba2fb7b062b8eeae39eee
          clone_at https://github.com/google/guice.git benchmarks/guice bb8fb34bf994586b81e7bdfe30e3d4fdf36a73b7
          clone_at https://github.com/lysine-dev/retrofit.git benchmarks/retrofit e27d855b7b029e7f907dfc52205fdb3e9c603c16
          clone_at https://github.com/typestack/class-validator.git benchmarks/class-validator 2e1a5c27dbd65b80e27fe96b49bd6e6641fa3603
          clone_at https://github.com/microsoft/tsyringe.git benchmarks/tsyringe 78222334f49265ea2874fac2c73284345c1124d9
          clone_at https://github.com/rayon-rs/rayon.git benchmarks/rayon ee0a00bdb1ab039e178a215ad5712fb7fa58e58f
          clone_at https://github.com/spf13/viper.git benchmarks/viper 528f7416c4b56a4948673984b190bf8713f0c3c4

      - name: Run first and only fresh holdout evaluation
        shell: bash
        run: |
          set -euo pipefail
          token-saver evaluate benchmarks/holdout-external-8.json \
            --path . \
            --max-tokens 6000 \
            --require-holdout \
            | tee benchmarks/holdout-external-8.result.json
          echo "===== HOLDOUT_8_RESULT_BEGIN ====="
          cat benchmarks/holdout-external-8.result.json
          echo "===== HOLDOUT_8_RESULT_END ====="
