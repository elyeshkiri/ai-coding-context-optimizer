name: PR4 Frozen Holdout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  frozen-holdout:
    if: github.event.pull_request.head.ref == 'fix/authoritative-file-ranking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/authoritative-file-ranking
      - name: Apply bounded provider reservation once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/token_saver/pack.py')
          text = path.read_text(encoding='utf-8')
          marker = 'authoritative_reserve = ('
          if marker in text:
              print('allocator patch already applied')
              raise SystemExit(0)
          old = '''    priority_seen = 0

    for item in candidates:
        if len(selected) >= max_files:
            break
        remaining = max_tokens - used
        if remaining <= 20:
            break
        if priority_files and item.rel in priority_files:
            priority_seen += 1
            slots_left = priority_total - priority_seen + 1
            if slots_left > 1:
                remaining = min(remaining, max(remaining // slots_left, 200))
'''
          new = '''    priority_seen = 0

    # Keep one bounded evidence slot for the strongest exact value provider.
    # Without this, a huge top-ranked consumer can spend the entire token
    # budget on its outline before a high-confidence one-hop semantic-ref
    # provider is considered. This is deliberately not global fair-sharing:
    # ordinary large files keep the historical greedy allocation behavior.
    authoritative_rel = next(
        (
            item.rel
            for item in candidates[: max(4, plan.seed_limit + 2)]
            if any(reason.startswith("graph:semantic-ref@1") for reason in item.reasons)
        ),
        None,
    )
    authoritative_reserve = (
        min(900, max(240, max_tokens // 8)) if authoritative_rel else 0
    )

    for item in candidates:
        if len(selected) >= max_files:
            break
        remaining = max_tokens - used
        if remaining <= 20:
            break
        if priority_files and item.rel in priority_files:
            priority_seen += 1
            slots_left = priority_total - priority_seen + 1
            if slots_left > 1:
                remaining = min(remaining, max(remaining // slots_left, 200))

        section_budget = remaining
        if (
            authoritative_rel
            and authoritative_rel not in selected
            and item.rel != authoritative_rel
        ):
            section_budget = max(0, remaining - authoritative_reserve)
            if section_budget <= 20:
                continue
'''
          if old not in text:
              raise SystemExit('allocator anchor not found')
          text = text.replace(old, new, 1)
          old_fit = '        fitted = _fit_section(section, remaining)\n'
          new_fit = '        fitted = _fit_section(section, section_budget)\n'
          if old_fit not in text:
              raise SystemExit('fit anchor not found')
          text = text.replace(old_fit, new_fit, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Push allocator patch if changed
        run: |
          if git diff --quiet -- src/token_saver/pack.py; then
            echo 'No allocator patch to push'
          else
            git config user.name 'Elyes Hkiri'
            git config user.email '55228083+elyeshkiri@users.noreply.github.com'
            git add src/token_saver/pack.py
            git commit -m 'fix: reserve budget for authoritative provider evidence'
            git push origin HEAD:fix/authoritative-file-ranking
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Clone frozen repositories
        run: |
          git clone https://github.com/encode/httpx.git benchmarks/httpx
          git -C benchmarks/httpx checkout b5addb64f0161ff6bfe94c124ef76f6a1fba5254
          git clone https://github.com/colinhacks/zod.git benchmarks/zod
          git -C benchmarks/zod checkout 59bbc03e10c636b9eb3c393dfeb552819774ec21
      - name: Diagnose remaining Zod allocation gap
        run: |
          python - <<'PY'
          from pathlib import Path
          from token_saver.pack import build_context_pack, rank_files
          from token_saver.repo_index import build_index

          root = Path('benchmarks/zod')
          query = 'validate that a string is a well formed email address'
          index = build_index(root, persist=False)
          ranked = rank_files(root, query, changed_boost=False, feedback_boost=False, index=index, seed_limit=6)
          print('TOP RANKING')
          for i, item in enumerate(ranked[:12], 1):
              print(i, item.rel, round(item.score, 3), item.term_hits, item.reasons)
          pack = build_context_pack(root, query, max_tokens=6000, changed_boost=False, feedback_boost=False, persist_index=False, index=index)
          print('PACK TOKENS', pack.estimated_tokens)
          print('SELECTED FILES', pack.selected_files)
          print('SELECTED SYMBOLS', pack.selected_symbols)
          PY
      - name: Run frozen external holdout
        run: token-saver evaluate benchmarks/holdout-external.json --path . --max-tokens 6000 --require-holdout
