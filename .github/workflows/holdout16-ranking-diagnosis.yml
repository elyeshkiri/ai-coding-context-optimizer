name: Holdout 16 Ranking Diagnosis

on:
  push:
    branches:
      - feature/holdout16-ranking-diagnosis

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[diagnose-h16-ranking]')
    name: H16 ranking diagnosis / ${{ matrix.alias }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - alias: httpx
            url: https://github.com/encode/httpx.git
            revision: b5addb64f0161ff6bfe94c124ef76f6a1fba5254
          - alias: requests
            url: https://github.com/psf/requests.git
            revision: 611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60
          - alias: serde_json
            url: https://github.com/serde-rs/json.git
            revision: afdf6fc67247dd7fa4fcde1381e6ecc6bcc7a30e
          - alias: jackson
            url: https://github.com/FasterXML/jackson-databind.git
            revision: 1da96ddfc6342b2b6fe2842977d51de66e255364
          - alias: pydantic
            url: https://github.com/pydantic/pydantic.git
            revision: a9a0e1d1f7805a1b7cc5b5d42e862594a570cf74
          - alias: trio
            url: https://github.com/python-trio/trio.git
            revision: 0480602b48eda20f10283e7ac04ed01848d7acff

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACCO
        run: python -m pip install -e '.[dev]'
      - name: Validate burned holdout seals
        run: |
          python scripts/run_semantic_holdout.py \
            benchmarks/semantic-holdout-16.frozen.json \
            --validate-only
      - name: Clone pinned repository
        shell: bash
        run: |
          set -euo pipefail
          path="benchmarks/semantic-holdout-16/${{ matrix.alias }}"
          mkdir -p "$(dirname "$path")"
          git init -q "$path"
          git -C "$path" remote add origin "${{ matrix.url }}"
          git -C "$path" fetch -q --depth 1 origin "${{ matrix.revision }}"
          git -C "$path" checkout -q --detach "${{ matrix.revision }}"
      - name: Diagnose ranking vs pack budget
        run: |
          python scripts/diagnose_holdout16_ranking.py \
            benchmarks/semantic-holdout-16.frozen.json \
            --repository "${{ matrix.alias }}" \
            --output "h16-ranking-${{ matrix.alias }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: h16-ranking-${{ matrix.alias }}
          path: h16-ranking-${{ matrix.alias }}.json
          retention-days: 30
          if-no-files-found: error
