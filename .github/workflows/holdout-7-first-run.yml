name: Holdout 7 First Run

on:
  push:
    branches:
      - test/holdout-external-7

jobs:
  holdout-7:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/holdout-external-7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Verify frozen ground truth before cloning repositories
        shell: bash
        run: |
          set -euo pipefail
          expected="ebd45fda46047399cf3d68a494760e25002cbe0e384b3ae2913834be5afa1249"
          actual="$(token-saver evaluate benchmarks/holdout-external-7.json --print-ground-truth-hash)"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$actual" = "$expected"

      - name: Clone pinned untouched repositories
        shell: bash
        run: |
          set -euo pipefail
          clone_at() {
            url="$1"
            dir="$2"
            sha="$3"
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch -q --depth=1 origin "$sha"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          }

          clone_at https://github.com/Textualize/rich.git benchmarks/rich 9d8f9a372cc5916fd4781fec207ced7ddac2f08f
          clone_at https://github.com/nestjs/nest.git benchmarks/nest f1def7602b6a42c74ce3062c306745c8cdeab6b5
          clone_at https://github.com/labstack/echo.git benchmarks/echo 9ce228d5b232644c40d03d40cc3e0c2df0b764a1
          clone_at https://github.com/uber-go/fx.git benchmarks/fx d5da5b04ac906bfbad8b400baeee9b970c1be6f3
          clone_at https://github.com/hyperium/hyper.git benchmarks/hyper 74a39081ff1496970fb75da75c5282b23a9b69e5
          clone_at https://github.com/serde-rs/serde.git benchmarks/serde a874a1b1bb1cc16cf5ee3b1b7b527af5705742bb
          clone_at https://github.com/FasterXML/jackson-databind.git benchmarks/jackson-databind 2a428d9b569ec1ac28f0b071a71f3296a43fa6a3
          clone_at https://github.com/DapperLib/Dapper.git benchmarks/dapper 8becae8d0e2b360165ae03c0d5d1330b0273473d

      - name: Run first and only fresh holdout evaluation
        shell: bash
        run: |
          set -euo pipefail
          token-saver evaluate benchmarks/holdout-external-7.json \
            --path . \
            --max-tokens 6000 \
            --require-holdout \
            | tee benchmarks/holdout-external-7.result.json
          echo "===== HOLDOUT_7_RESULT_BEGIN ====="
          cat benchmarks/holdout-external-7.result.json
          echo "===== HOLDOUT_7_RESULT_END ====="
