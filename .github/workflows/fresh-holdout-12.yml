name: Fresh External Holdout 12

on:
  push:
    branches:
      - bench/fresh-holdout-12

permissions:
  contents: read

jobs:
  holdout12:
    if: contains(github.event.head_commit.message, '[run-holdout12]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Token Saver
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen ground truth before evaluation
        run: |
          declared="$(python - <<'PY'
          import json
          p=json.load(open("benchmarks/holdout-external-12.json"))
          print(p["protocol"]["ground_truth_sha256"])
          PY
          )"
          computed="$(token-saver evaluate benchmarks/holdout-external-12.json --print-ground-truth-hash)"
          echo "declared=$declared"
          echo "computed=$computed"
          test "$declared" = "$computed"

      - name: Clone pinned external repositories
        shell: bash
        run: |
          set -euo pipefail
          clone_at() {
            local url="$1"
            local sha="$2"
            local path="$3"
            mkdir -p "$(dirname "$path")"
            git init -q "$path"
            git -C "$path" remote add origin "$url"
            git -C "$path" fetch -q --depth=1 origin "$sha"
            git -C "$path" checkout -q --detach "$sha"
            actual="$(git -C "$path" rev-parse HEAD)"
            test "$actual" = "$sha"
          }
          clone_at https://github.com/encode/httpx.git \
            b5addb64f0161ff6bfe94c124ef76f6a1fba5254 benchmarks/holdout12/httpx
          clone_at https://github.com/fastapi/fastapi.git \
            50113da16fec53b66b80d75e80a89296de4fa5a5 benchmarks/holdout12/fastapi
          clone_at https://github.com/go-chi/chi.git \
            3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc benchmarks/holdout12/chi
          clone_at https://github.com/tokio-rs/axum.git \
            3ea7f31b8e43962053d5e45a8cea87097adb9ca0 benchmarks/holdout12/axum
          clone_at https://github.com/apache/commons-lang.git \
            d235f1e997523d7a3d9d1c63e9a1853c2ab728fd benchmarks/holdout12/commons-lang

      - name: Run fresh holdout exactly once
        run: |
          token-saver evaluate benchmarks/holdout-external-12.json \
            --require-holdout \
            > holdout-external-12.result.json

      - name: Summarize immutable first result
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open("holdout-external-12.result.json"))
          s=p["summary"]
          print("# Fresh External Holdout 12")
          print()
          print(f"- tasks: {s['task_count']}")
          print(f"- file recall: {s['mean_file_recall']:.2%}")
          print(f"- bare symbol recall: {s['mean_symbol_recall']:.2%}")
          print(f"- scoped symbol recall: {s['mean_symbol_recall_in_expected_files']:.2%}")
          print(f"- qualified symbol recall: {s['mean_qualified_symbol_recall']:.2%}")
          print(f"- exact identity recall: {s['mean_symbol_identity_recall']:.2%}")
          print(f"- mean token reduction: {s['mean_token_reduction']:.2%}")
          print(f"- ground truth SHA-256: {p['ground_truth_sha256']}")
          print()
          print("Per repository:")
          for name, row in p["repositories"].items():
              print(
                  f"- {name}: file {row['mean_file_recall']:.1%}, "
                  f"scoped {row['mean_symbol_recall_in_expected_files']:.1%}, "
                  f"qualified {row['mean_qualified_symbol_recall']:.1%}, "
                  f"identity {row['mean_symbol_identity_recall']:.1%}"
              )
          PY

      - name: Upload first-run result
        uses: actions/upload-artifact@v4
        with:
          name: fresh-holdout-12-result
          path: holdout-external-12.result.json
          if-no-files-found: error
          retention-days: 90
