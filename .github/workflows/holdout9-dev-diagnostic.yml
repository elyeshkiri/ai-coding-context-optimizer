name: Holdout 9 Burned Diagnostic

on:
  push:
    branches:
      - fix/callable-identity-ranking-v5
    paths:
      - .github/workflows/holdout9-dev-diagnostic.yml

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/callable-identity-ranking-v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development revision
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen burned manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from token_saver.evaluate import ground_truth_hash
          payload = json.loads(Path("benchmarks/holdout-external-9.json").read_text())
          actual = ground_truth_hash(payload)
          assert actual == payload["protocol"]["ground_truth_sha256"]
          print(actual)
          PY

      - name: Clone pinned repositories
        run: |
          set -euo pipefail
          clone_at() {
            repo="$1"
            sha="$2"
            dest="$3"
            git init -q "$dest"
            git -C "$dest" remote add origin "https://github.com/$repo.git"
            git -C "$dest" fetch -q --depth=1 origin "$sha"
            git -C "$dest" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$sha"
          }
          clone_at NLog/NLog 5e60d28d428c044ae5d6b36bf8875ec7370cf046 benchmarks/NLog
          clone_at FluentAssertions/FluentAssertions e5349243870e70b36945af6bf10ab3b64e768a13 benchmarks/FluentAssertions
          clone_at ben-manes/caffeine c0edd00bb6063e59ee1e7a7db5588fac7a6524f5 benchmarks/caffeine
          clone_at apache/commons-lang 8c730822620f2e5a9e7e64443483127f438e51b7 benchmarks/commons-lang
          clone_at typeorm/typeorm b1eafc23d8d695a2e2f4ebe9063d9a0c92415d1d benchmarks/typeorm
          clone_at typestack/class-transformer a2734a5d154c9b0beb9a10555a04416bc371de06 benchmarks/class-transformer
          clone_at tokio-rs/tokio cf782c5b917b7ea21b6f97f07104ebf16d35f5f8 benchmarks/tokio
          clone_at sirupsen/logrus 6d6a132bc03324d4ceb78e1b927f995d014cda20 benchmarks/logrus

      - name: Run burned holdout diagnostic
        run: |
          token-saver evaluate benchmarks/holdout-external-9.json \
            --path . \
            --max-tokens 6000 \
            --require-holdout > /tmp/holdout9-dev.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/holdout9-dev.json"))
          print("DEV_DIAGNOSTIC_SUMMARY", json.dumps(p["summary"], sort_keys=True))
          print("DEV_DIAGNOSTIC_REPOS", json.dumps(p["repositories"], sort_keys=True))
          print("NOTE: burned holdout diagnostic only; not fresh evidence")
          PY
