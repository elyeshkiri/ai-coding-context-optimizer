name: PR4 Frozen Holdout

on:
  pull_request:
    branches: [main]

jobs:
  frozen-holdout:
    if: github.event.pull_request.head.ref == 'fix/authoritative-file-ranking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Clone frozen repositories
        run: |
          git clone https://github.com/encode/httpx.git benchmarks/httpx
          git -C benchmarks/httpx checkout b5addb64f0161ff6bfe94c124ef76f6a1fba5254
          git clone https://github.com/colinhacks/zod.git benchmarks/zod
          git -C benchmarks/zod checkout 59bbc03e10c636b9eb3c393dfeb552819774ec21
      - name: Diagnose remaining Zod ranking gap
        run: |
          python - <<'PY'
          from pathlib import Path
          from token_saver.pack import rank_files
          from token_saver.repo_index import build_index

          root = Path('benchmarks/zod')
          query = 'validate that a string is a well formed email address'
          index = build_index(root, persist=False)
          ranked = rank_files(
              root,
              query,
              changed_boost=False,
              feedback_boost=False,
              index=index,
              seed_limit=6,
          )
          print('TOP RANKING')
          for i, item in enumerate(ranked[:20], 1):
              print(i, item.rel, round(item.score, 3), item.term_hits, item.reasons)
          for rel in [
              'packages/zod/src/v4/core/schemas.ts',
              'packages/zod/src/v4/core/regexes.ts',
          ]:
              rec = index.records.get(rel)
              print('\nRECORD', rel)
              if rec is None:
                  print('missing')
                  continue
              print('symbols containing email:', [s for s in rec.symbols if 'email' in s.lower()])
              print('semantic refs containing email:', [r for r in rec.semantic_refs or [] if 'email' in str(r).lower()])
          PY
      - name: Run frozen external holdout
        run: token-saver evaluate benchmarks/holdout-external.json --path . --max-tokens 6000 --require-holdout
