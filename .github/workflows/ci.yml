name: CI

on:
  # PR updates validate feature branches; main is revalidated after merge.
  # Avoid a second duplicate push run for branches that already have a PR.
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # Scoped to correctness rules, not formatting -- see [tool.ruff.lint]
      # in pyproject.toml for why E501/E701/E702/I are deliberately excluded.
      - run: ruff check src tests scripts
      - name: Enforce 100% docstring coverage
        run: interrogate src/acco
      - name: Enforce frozen command-output preservation floor
        run: |
          set -o pipefail
          acco output-replay \
            benchmarks/output-quality-session-v17.frozen.json \
            --require-frozen | tee /tmp/output-quality-session.json
      - name: Enforce 40-processor CLI compression ratchet
        run: |
          set -o pipefail
          acco output-replay \
            benchmarks/cli-output-compression-ratchet-v1.frozen.json \
            --require-frozen | tee /tmp/cli-output-compression-ratchet.json
      # An invalid workflow expression is rejected by GitHub before any job
      # is created, so it shows up as a zero-second failure with no logs and
      # cannot be caught by any job running inside the workflow. release.yml
      # shipped broken exactly once this way (`secrets` used in a step-level
      # `if`, where that context is unavailable). Validate the workflows
      # themselves from a job that does run.
      - name: Lint GitHub Actions workflows
        run: |
          curl -sSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xzf actionlint.tar.gz actionlint
          ./actionlint .github/workflows/*.yml

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: acco evaluate benchmarks/context-quality.json --path . --max-tokens 6000

  standalone-smoke:
    name: Standalone smoke (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python_arch: x64
            asset: linux-x86_64
            binary: dist/acco
          - os: ubuntu-24.04-arm
            python_arch: arm64
            asset: linux-arm64
            binary: dist/acco
          - os: macos-14
            python_arch: arm64
            asset: macos-arm64
            binary: dist/acco
          - os: macos-15-intel
            python_arch: x64
            asset: macos-x86_64
            binary: dist/acco
          - os: windows-latest
            python_arch: x64
            asset: windows-x86_64
            binary: dist/acco.exe
          - os: windows-11-arm
            python_arch: arm64
            asset: windows-arm64
            binary: dist/acco.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
      - name: Build standalone executable
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install .
          pyinstaller             --clean             --onefile             --name acco             --collect-all acco             --collect-all tree_sitter             --collect-all tree_sitter_javascript             --collect-all tree_sitter_typescript             --collect-all tree_sitter_go             --collect-all tree_sitter_rust             --collect-all tree_sitter_java             --collect-all tree_sitter_c_sharp             packaging/standalone_entry.py
      - name: Exercise standalone CLI and provider-free demo
        shell: bash
        run: |
          "${{ matrix.binary }}" --help
          "${{ matrix.binary }}" demo .             --query "provider wrapper launch"             --max-tokens 1000             --json > standalone-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("standalone-smoke.json").read_text())
          assert data["provider_request_made"] is False
          assert data["context_pack_tokens"] > 0
          PY

  windows-core:
    name: Windows core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACCO and development dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run full Python suite on native Windows
        shell: pwsh
        run: python -m pytest -q
      - name: Enforce Windows retrieval quality
        shell: pwsh
        run: acco evaluate benchmarks/context-quality.json --path . --max-tokens 6000
      - name: Exercise Windows product UX
        shell: pwsh
        run: |
          acco demo . --query "provider wrapper launch" --max-tokens 1000 --json | Out-File -Encoding utf8 windows-demo.json
          $demo = Get-Content windows-demo.json -Raw | ConvertFrom-Json
          if ($demo.provider_request_made -ne $false) { throw "demo unexpectedly called a provider" }
          if ($demo.context_pack_tokens -le 0) { throw "demo returned an empty context pack" }
          $completion = acco completion powershell
          [void][scriptblock]::Create(($completion -join [Environment]::NewLine))
          [void][scriptblock]::Create((Get-Content scripts/install-standalone.ps1 -Raw))

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned typechecker
        run: npm install --ignore-scripts
      - name: Typecheck public TypeScript source
        run: npm run typecheck
      - name: Test published JavaScript runtime
        run: npm test
      - name: Verify package contents
        run: npm run pack:check

  holdout:
    # The 25-task self-benchmark above is saturated at 100% and cannot detect
    # a ranking regression. This runs a real frozen external holdout against
    # pinned third-party repositories and enforces file, bare-symbol, and
    # expected-file-scoped symbol recall floors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Enforce frozen holdout regression floor
        run: python scripts/check_holdout.py benchmarks/holdout-external.floor.json

  ranking-regression:
    # Informational PR-only comparison. Broken snapshot/diff execution fails,
    # but rank movement itself does not block until a floor is calibrated.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 1

      - name: Checkout protected base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install protected-main baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./baseline

      - name: Capture protected-main ranking snapshot
        run: |
          acco ranking-snapshot baseline/benchmarks/context-quality.json \
            --path baseline \
            --max-files 20 \
            --out baseline-ranking.json

      - name: Install candidate ACCO
        run: python -m pip install --force-reinstall --no-deps -e ./candidate

      - name: Capture candidate ranking snapshot
        # Deliberately use the base manifest for both sides so a PR cannot
        # redefine the ground truth used by its own regression comparison.
        run: |
          acco ranking-snapshot baseline/benchmarks/context-quality.json \
            --path candidate \
            --max-files 20 \
            --out candidate-ranking.json

      - name: Compare ranking snapshots
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          acco ranking-diff baseline-ranking.json candidate-ranking.json \
            --json > ranking-diff.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("ranking-diff.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["ci"] = {
              "pull_request": int(os.environ["PR_NUMBER"]),
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "base_sha": os.environ["BASE_SHA"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
          }
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          acco ranking-diff baseline-ranking.json candidate-ranking.json \
            --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ranking regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-regression-${{ github.event.pull_request.number }}
          path: |
            baseline-ranking.json
            candidate-ranking.json
            ranking-diff.json
          if-no-files-found: warn
          retention-days: 14


  rust-fastpath:
    name: Rust fastpath parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' maturin
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/acco_fast/Cargo.toml -- --check
      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/acco_fast/Cargo.toml
      - name: Build optional accelerator wheel
        run: |
          maturin build             --release             --manifest-path rust/acco_fast/Cargo.toml             --interpreter python             --out /tmp/acco-fast
          python -m pip install /tmp/acco-fast/*.whl
      - name: Require native backend
        run: |
          python - <<'PY'
          from acco.fastpath import status
          result = status()
          assert result["backend"] == "rust", result
          print(result)
          PY
      - name: Enforce Python-Rust behavior parity
        env:
          ACCO_RUST_FASTPATH: "1"
        run: |
          python -m pytest -q             tests/test_fastpath.py             tests/test_pack.py             tests/test_retrieval_cache.py
          acco evaluate             benchmarks/context-quality.json             --path .             --max-tokens 6000


  semantic-ann:
    name: Semantic HNSW parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' 'hnswlib>=0.8,<1'
      - name: Exercise semantic exact-source contracts through HNSW
        run: python -m pytest -q tests/test_semantic_retrieval.py


  cli-corpus-capture:
    # Capture untouched real command output before any further processor tuning.
    # The artifact is evidence input, not a benchmark claim by itself.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' mypy pylint
      - run: npm install -g typescript eslint
      - name: Capture provenance-backed CLI outputs
        run: |
          python scripts/capture_cli_output_corpus.py \
            --out cli-corpus-capture \
            --workspace .tmp-cli-corpus-workspace \
            --min-captures 20
      - name: Upload untouched CLI corpus
        uses: actions/upload-artifact@v4
        with:
          name: cli-output-corpus-${{ github.event.pull_request.head.sha }}
          path: cli-corpus-capture
          if-no-files-found: error
          retention-days: 30
      - name: Check out pinned ppgranger comparator
        run: |
          git clone --quiet https://github.com/ppgranger/token-saver.git /tmp/ppgranger-token-saver
          git -C /tmp/ppgranger-token-saver checkout --quiet 19d47b2cc19457c865f2414ad78f8efa80204b43
      - name: Compare both engines on frozen real-output corpus
        run: |
          python scripts/evaluate_cli_output_real_corpus.py \
            --corpus benchmarks/cli-output-real-v1 \
            --ppgranger-path /tmp/ppgranger-token-saver \
            --ppgranger-sha 19d47b2cc19457c865f2414ad78f8efa80204b43 \
            --out cli-output-real-v1-comparison.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("cli-output-real-v1-comparison.json").read_text())
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Frozen real CLI output comparison\n\n")
              out.write("| Engine | Weighted token reduction | Critical survival | Changed cases |\n")
              out.write("| --- | ---: | ---: | ---: |\n")
              for key in ("elyeshkiri", "ppgranger"):
                  summary = report[key]["summary"]
                  out.write(
                      f"| {key} | {summary['weighted_token_reduction'] * 100:.2f}% "
                      f"| {summary['critical_survival_rate'] * 100:.2f}% "
                      f"| {summary['changed_cases']}/{summary['cases']} |\n"
                  )
          PY
      - name: Upload frozen corpus comparison
        uses: actions/upload-artifact@v4
        with:
          name: cli-output-real-v1-comparison-${{ github.event.pull_request.head.sha }}
          path: cli-output-real-v1-comparison.json
          if-no-files-found: error
          retention-days: 30


  cli-corpus-v2-compare:
    # Corpus v2 is already frozen in Git. This job only evaluates those exact
    # bytes; it never recaptures or mutates the proof set.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Check out pinned ppgranger comparator
        run: |
          git clone --quiet https://github.com/ppgranger/token-saver.git /tmp/ppgranger-token-saver
          git -C /tmp/ppgranger-token-saver checkout --quiet 19d47b2cc19457c865f2414ad78f8efa80204b43
      - name: Compare both engines on untouched frozen corpus v2
        run: |
          python scripts/evaluate_cli_output_real_archive.py \
            --archive benchmarks/cli-output-real-v2/corpus.zip \
            --freeze benchmarks/cli-output-real-v2/freeze.json \
            --ppgranger-path /tmp/ppgranger-token-saver \
            --ppgranger-sha 19d47b2cc19457c865f2414ad78f8efa80204b43 \
            --out cli-output-real-v2-comparison.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("cli-output-real-v2-comparison.json").read_text(encoding="utf-8")
          )
          target_prefixes = (
              "git-status",
              "git-diff",
              "git-log",
              "go-build",
              "go-test",
          )

          def subset_summary(rows):
              selected = [
                  row for row in rows
                  if row["id"].startswith(target_prefixes)
              ]
              original = sum(row["original_tokens"] for row in selected)
              output = sum(row["output_tokens"] for row in selected)
              critical = [row for row in selected if row["critical_lines"]]
              return {
                  "cases": len(selected),
                  "reduction": 0.0 if not original else 1.0 - output / original,
                  "critical": (
                      1.0
                      if not critical
                      else sum(row["critical_survival"] for row in critical)
                      / len(critical)
                  ),
              }

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as out:
              out.write("## Fresh frozen CLI corpus v2 comparison\n\n")
              out.write(
                  "| Engine | Overall token reduction | Critical survival | "
                  "Git/Go target reduction | Git/Go critical survival |\n"
              )
              out.write("| --- | ---: | ---: | ---: | ---: |\n")
              for key in ("elyeshkiri", "ppgranger"):
                  overall = report[key]["summary"]
                  target = subset_summary(report[key]["cases"])
                  out.write(
                      f"| {key} "
                      f"| {overall['weighted_token_reduction'] * 100:.2f}% "
                      f"| {overall['critical_survival_rate'] * 100:.2f}% "
                      f"| {target['reduction'] * 100:.2f}% "
                      f"| {target['critical'] * 100:.2f}% |\n"
                  )
          PY
      - name: Upload frozen corpus v2 comparison
        uses: actions/upload-artifact@v4
        with:
          name: cli-output-real-v2-comparison-${{ github.event.pull_request.head.sha }}
          path: cli-output-real-v2-comparison.json
          if-no-files-found: error
          retention-days: 30


  cli-corpus-v3-compare:
    # Corpus v3 is immutable in Git. Verify raw hashes, then evaluate only those bytes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Check out pinned ppgranger comparator
        run: |
          git clone --quiet https://github.com/ppgranger/token-saver.git /tmp/ppgranger-token-saver
          git -C /tmp/ppgranger-token-saver checkout --quiet 19d47b2cc19457c865f2414ad78f8efa80204b43
      - name: Compare both engines on untouched frozen corpus v3
        run: |
          python scripts/evaluate_cli_output_real_corpus.py \
            --corpus benchmarks/cli-output-real-v3 \
            --ppgranger-path /tmp/ppgranger-token-saver \
            --ppgranger-sha 19d47b2cc19457c865f2414ad78f8efa80204b43 \
            --out cli-output-real-v3-comparison.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("cli-output-real-v3-comparison.json").read_text(encoding="utf-8")
          )

          def subset(rows, prefixes):
              selected = [
                  row for row in rows
                  if row["id"].startswith(prefixes)
              ]
              original = sum(row["original_tokens"] for row in selected)
              output = sum(row["output_tokens"] for row in selected)
              critical = [row for row in selected if row["critical_lines"]]
              return {
                  "cases": len(selected),
                  "tokens": output,
                  "reduction": 0.0 if not original else 1.0 - output / original,
                  "critical": (
                      1.0
                      if not critical
                      else sum(row["critical_survival"] for row in critical)
                      / len(critical)
                  ),
              }

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as out:
              out.write("## Fresh frozen CLI corpus v3 comparison\n\n")
              out.write(
                  "| Engine | Overall reduction | Critical survival | "
                  "Git log reduction | Git status reduction | "
                  "Git log/status reduction |\n"
              )
              out.write("| --- | ---: | ---: | ---: | ---: | ---: |\n")
              for key in ("elyeshkiri", "ppgranger"):
                  overall = report[key]["summary"]
                  log = subset(report[key]["cases"], ("git-log-",))
                  status = subset(report[key]["cases"], ("git-status-",))
                  target = subset(
                      report[key]["cases"],
                      ("git-log-", "git-status-"),
                  )
                  out.write(
                      f"| {key} "
                      f"| {overall['weighted_token_reduction'] * 100:.2f}% "
                      f"| {overall['critical_survival_rate'] * 100:.2f}% "
                      f"| {log['reduction'] * 100:.2f}% "
                      f"| {status['reduction'] * 100:.2f}% "
                      f"| {target['reduction'] * 100:.2f}% |\n"
                  )
          PY
      - name: Upload frozen corpus v3 comparison
        uses: actions/upload-artifact@v4
        with:
          name: cli-output-real-v3-comparison-${{ github.event.pull_request.head.sha }}
          path: cli-output-real-v3-comparison.json
          if-no-files-found: error
          retention-days: 30
