name: CI

on:
  # PR updates validate feature branches; main is revalidated after merge.
  # Avoid a second duplicate push run for branches that already have a PR.
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # Scoped to correctness rules, not formatting -- see [tool.ruff.lint]
      # in pyproject.toml for why E501/E701/E702/I are deliberately excluded.
      - run: ruff check src tests scripts
      - name: Enforce 100% docstring coverage
        run: interrogate src/token_saver
      - name: Enforce frozen command-output preservation floor
        run: |
          token-saver output-replay \
            benchmarks/output-quality-session-v17.frozen.json \
            --require-frozen > /tmp/output-quality-session.json
      - name: Enforce 40-processor CLI compression ratchet
        run: |
          set -o pipefail
          token-saver output-replay \
            benchmarks/cli-output-compression-ratchet-v1.frozen.json \
            --require-frozen | tee /tmp/cli-output-compression-ratchet.json
      # An invalid workflow expression is rejected by GitHub before any job
      # is created, so it shows up as a zero-second failure with no logs and
      # cannot be caught by any job running inside the workflow. release.yml
      # shipped broken exactly once this way (`secrets` used in a step-level
      # `if`, where that context is unavailable). Validate the workflows
      # themselves from a job that does run.
      - name: Lint GitHub Actions workflows
        run: |
          curl -sSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf actionlint.tar.gz actionlint
          ./actionlint .github/workflows/*.yml

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: token-saver evaluate benchmarks/context-quality.json --path . --max-tokens 6000

  holdout:
    # The 25-task self-benchmark above is saturated at 100% and cannot detect
    # a ranking regression. This runs a real frozen external holdout against
    # pinned third-party repositories and enforces file, bare-symbol, and
    # expected-file-scoped symbol recall floors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Enforce frozen holdout regression floor
        run: python scripts/check_holdout.py benchmarks/holdout-external.floor.json

  ranking-regression:
    # Informational PR-only comparison. Broken snapshot/diff execution fails,
    # but rank movement itself does not block until a floor is calibrated.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 1

      - name: Checkout protected base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install baseline Token Saver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./baseline

      - name: Capture protected-main ranking snapshot
        run: |
          token-saver ranking-snapshot baseline/benchmarks/context-quality.json \
            --path baseline \
            --max-files 20 \
            --out baseline-ranking.json

      - name: Install candidate Token Saver
        run: python -m pip install --force-reinstall --no-deps -e ./candidate

      - name: Capture candidate ranking snapshot
        # Deliberately use the base manifest for both sides so a PR cannot
        # redefine the ground truth used by its own regression comparison.
        run: |
          token-saver ranking-snapshot baseline/benchmarks/context-quality.json \
            --path candidate \
            --max-files 20 \
            --out candidate-ranking.json

      - name: Compare ranking snapshots
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          token-saver ranking-diff baseline-ranking.json candidate-ranking.json \
            --json > ranking-diff.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("ranking-diff.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["ci"] = {
              "pull_request": int(os.environ["PR_NUMBER"]),
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "base_sha": os.environ["BASE_SHA"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
          }
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          token-saver ranking-diff baseline-ranking.json candidate-ranking.json \
            --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ranking regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-regression-${{ github.event.pull_request.number }}
          path: |
            baseline-ranking.json
            candidate-ranking.json
            ranking-diff.json
          if-no-files-found: warn
          retention-days: 14


  rust-fastpath:
    name: Rust fastpath parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' maturin
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/token_saver_fast/Cargo.toml -- --check
      - name: Run Rust unit tests
        run: cargo test --manifest-path rust/token_saver_fast/Cargo.toml
      - name: Build optional accelerator wheel
        run: |
          maturin build             --release             --manifest-path rust/token_saver_fast/Cargo.toml             --interpreter python             --out /tmp/token-saver-fast
          python -m pip install /tmp/token-saver-fast/*.whl
      - name: Require native backend
        run: |
          python - <<'PY'
          from token_saver.fastpath import status
          result = status()
          assert result["backend"] == "rust", result
          print(result)
          PY
      - name: Enforce Python-Rust behavior parity
        env:
          TOKEN_SAVER_RUST_FASTPATH: "1"
        run: |
          python -m pytest -q             tests/test_fastpath.py             tests/test_pack.py             tests/test_retrieval_cache.py
          token-saver evaluate             benchmarks/context-quality.json             --path .             --max-tokens 6000


  semantic-ann:
    name: Semantic HNSW parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' 'hnswlib>=0.8,<1'
      - name: Exercise semantic exact-source contracts through HNSW
        run: python -m pytest -q tests/test_semantic_retrieval.py


  cli-corpus-capture:
    # Capture untouched real command output before any further processor tuning.
    # The artifact is evidence input, not a benchmark claim by itself.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' mypy pylint
      - run: npm install -g typescript eslint
      - name: Capture provenance-backed CLI outputs
        run: |
          python scripts/capture_cli_output_corpus.py \
            --out cli-corpus-capture \
            --workspace .tmp-cli-corpus-workspace \
            --min-captures 20
      - name: Upload untouched CLI corpus
        uses: actions/upload-artifact@v4
        with:
          name: cli-output-corpus-${{ github.event.pull_request.head.sha }}
          path: cli-corpus-capture
          if-no-files-found: error
          retention-days: 30
      - name: Check out pinned ppgranger comparator
        run: |
          git clone --quiet https://github.com/ppgranger/token-saver.git /tmp/ppgranger-token-saver
          git -C /tmp/ppgranger-token-saver checkout --quiet 19d47b2cc19457c865f2414ad78f8efa80204b43
      - name: Compare both engines on frozen real-output corpus
        run: |
          python scripts/evaluate_cli_output_real_corpus.py \
            --corpus benchmarks/cli-output-real-v1 \
            --ppgranger-path /tmp/ppgranger-token-saver \
            --ppgranger-sha 19d47b2cc19457c865f2414ad78f8efa80204b43 \
            --out cli-output-real-v1-comparison.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("cli-output-real-v1-comparison.json").read_text())
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Frozen real CLI output comparison\n\n")
              out.write("| Engine | Weighted token reduction | Critical survival | Changed cases |\n")
              out.write("| --- | ---: | ---: | ---: |\n")
              for key in ("elyeshkiri", "ppgranger"):
                  summary = report[key]["summary"]
                  out.write(
                      f"| {key} | {summary['weighted_token_reduction'] * 100:.2f}% "
                      f"| {summary['critical_survival_rate'] * 100:.2f}% "
                      f"| {summary['changed_cases']}/{summary['cases']} |\n"
                  )
          PY
      - name: Upload frozen corpus comparison
        uses: actions/upload-artifact@v4
        with:
          name: cli-output-real-v1-comparison-${{ github.event.pull_request.head.sha }}
          path: cli-output-real-v1-comparison.json
          if-no-files-found: error
          retention-days: 30
