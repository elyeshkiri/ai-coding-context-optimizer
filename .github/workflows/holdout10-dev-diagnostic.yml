name: Holdout 10 Burned Diagnostic

on:
  push:
    branches:
      - fix/csharp14-extension-blocks
    paths:
      - .github/workflows/holdout10-dev-diagnostic.yml

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/csharp14-extension-blocks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development revision
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen burned manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from token_saver.evaluate import ground_truth_hash
          payload = json.loads(Path("benchmarks/holdout-external-10.json").read_text())
          actual = ground_truth_hash(payload)
          assert actual == payload["protocol"]["ground_truth_sha256"]
          print(actual)
          PY

      - name: Clone pinned repositories
        run: |
          set -euo pipefail
          clone_at() {
            repo="$1"
            sha="$2"
            dest="$3"
            git init -q "$dest"
            git -C "$dest" remote add origin "https://github.com/$repo.git"
            git -C "$dest" fetch -q --depth=1 origin "$sha"
            git -C "$dest" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$sha"
          }
          clone_at restsharp/RestSharp 64ee12995b8d7409a5863da7b71cddfa526ffb7a benchmarks/RestSharp
          clone_at shouldly/shouldly c6dd8686c544454cebc19f88f83c4887e5a5a398 benchmarks/shouldly
          clone_at mockito/mockito 9c5f36fb9f2ad89fbaab828d33d144cd398a4079 benchmarks/mockito
          clone_at apache/commons-collections 21d6821190e0325022510393f41faa8ec95b6397 benchmarks/commons-collections
          clone_at mongodb/node-mongodb-native 7e953ed5c5d02af5d732e0be6980ad6c5692a08c benchmarks/mongodb
          clone_at TanStack/query d346e85f0144eb9b991e6e1665b22f4574de9751 benchmarks/tanstack-query
          clone_at rust-lang/futures-rs f4f4fa3a3673ca13b4c9b21252fb49fb1e4fe3c5 benchmarks/futures-rs
          clone_at go-gorm/gorm b3d3bf219f0283f8e2e985bac509cb643170f729 benchmarks/gorm

      - name: Run burned holdout diagnostic
        run: |
          token-saver evaluate benchmarks/holdout-external-10.json \
            --path . \
            --max-tokens 6000 \
            --require-holdout > /tmp/holdout10-dev.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/holdout10-dev.json"))
          print("DEV_DIAGNOSTIC_SUMMARY", json.dumps(p["summary"], sort_keys=True))
          print("DEV_DIAGNOSTIC_REPOS", json.dumps(p["repositories"], sort_keys=True))
          print("NOTE: burned holdout diagnostic only; not fresh evidence")
          PY
