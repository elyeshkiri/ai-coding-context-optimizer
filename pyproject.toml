[project]
name = "token-saver"
version = "1.2.0"
dependencies = ["tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24", "tree-sitter-go>=0.25,<0.26", "tree-sitter-rust>=0.24,<0.25", "tree-sitter-java>=0.23,<0.24", "tree-sitter-c-sharp>=0.23,<0.24"]
description = "Compile coding tasks and patches into minimal evidence-complete context for AI agents."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]
# provider-aware exact token counting: Anthropic API + OpenAI local tokenizer
exact = ["anthropic>=0.40", "tiktoken>=0.7,<1"]
google = ["google-genai>=1,<2"]
embeddings = ["sentence-transformers>=3,<6"]

[project.scripts]
token-saver = "token_saver.entry:main"
token-saver-pack = "token_saver.pack_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/token-saver/benchmarks" = ["benchmarks/*.json"]
"share/token-saver/integrations" = ["integrations/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
