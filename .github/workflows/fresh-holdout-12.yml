name: Fresh External Holdout 12

on:
  push:
    branches:
      - bench/fresh-holdout-12-72

permissions:
  contents: read

jobs:
  holdout12:
    if: contains(github.event.head_commit.message, '[run-holdout12]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Token Saver
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen ground truth before evaluation
        run: |
          declared="$(python - <<'PY'
          import json
          p=json.load(open("benchmarks/holdout-external-12.json"))
          print(p["protocol"]["ground_truth_sha256"])
          PY
          )"
          computed="$(token-saver evaluate benchmarks/holdout-external-12.json --print-ground-truth-hash)"
          echo "declared=$declared"
          echo "computed=$computed"
          test "$declared" = "$computed"

      - name: Clone pinned external repositories
        shell: bash
        run: |
          set -euo pipefail
          clone_at() {
            local url="$1"
            local sha="$2"
            local path="$3"
            mkdir -p "$(dirname "$path")"
            git init -q "$path"
            git -C "$path" remote add origin "$url"
            git -C "$path" fetch -q --depth=1 origin "$sha"
            git -C "$path" checkout -q --detach "$sha"
            actual="$(git -C "$path" rev-parse HEAD)"
            test "$actual" = "$sha"
          }
          clone_at https://github.com/pallets/itsdangerous.git \
            672971d66a2ef9f85151e53283113f33d642dabd benchmarks/holdout12/itsdangerous
          clone_at https://github.com/encode/httpcore.git \
            10a658221deb38a4c5b16db55ab554b0bf731707 benchmarks/holdout12/py-httpcore
          clone_at https://github.com/gorilla/websocket.git \
            e064f32e3674d9d79a8fd417b5bc06fa5c6cad8f benchmarks/holdout12/websocket
          clone_at https://github.com/rs/zerolog.git \
            5eb5f3a76c09eeadc1f2464baf4a4e3f1037c830 benchmarks/holdout12/zerolog
          clone_at https://github.com/uuid-rs/uuid.git \
            9f927126c89892ddfed6cd2f92df16852f3f9aa6 benchmarks/holdout12/uuid
          clone_at https://github.com/crossbeam-rs/crossbeam.git \
            38dacb462261fcd64edcb308aed9cbf95c8c82c3 benchmarks/holdout12/crossbeam
          clone_at https://github.com/apache/commons-text.git \
            ae3d36b8cea5d1fa5eaf3bd28f07bb111d1890e0 benchmarks/holdout12/commons-text
          clone_at https://github.com/apache/commons-codec.git \
            089f90450fd1f8acafad3fe626b9e9425aff5a3c benchmarks/holdout12/commons-codec
          clone_at https://github.com/pmndrs/zustand.git \
            b57db4f86ef179285da216eeb291266da82c361c benchmarks/holdout12/zustand
          clone_at https://github.com/react-hook-form/react-hook-form.git \
            1747bde471b452d1223c1e7e6ec740fcd63400f5 benchmarks/holdout12/react-hook-form
          clone_at https://github.com/Humanizr/Humanizer.git \
            ffc2b77c0f30d2fb176875841424379319d0ae9b benchmarks/holdout12/humanizer
          clone_at https://github.com/JamesNK/Newtonsoft.Json.git \
            09bb545d72969ad7fb4ea07db0d5c34f4fc07877 benchmarks/holdout12/newtonsoft

      - name: Run fresh holdout exactly once
        run: |
          token-saver evaluate benchmarks/holdout-external-12.json \
            --require-holdout \
            > holdout-external-12.result.json

      - name: Summarize immutable first result
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p=json.load(open("holdout-external-12.result.json"))
          s=p["summary"]
          print("# Fresh External Holdout 12")
          print()
          print(f"- tasks: {s['task_count']}")
          print(f"- file recall: {s['mean_file_recall']:.2%}")
          print(f"- bare symbol recall: {s['mean_symbol_recall']:.2%}")
          print(f"- scoped symbol recall: {s['mean_symbol_recall_in_expected_files']:.2%}")
          print(f"- qualified symbol recall: {s['mean_qualified_symbol_recall']:.2%}")
          print(f"- exact identity recall: {s['mean_symbol_identity_recall']:.2%}")
          print(f"- mean token reduction: {s['mean_token_reduction']:.2%}")
          print(f"- ground truth SHA-256: {p['ground_truth_sha256']}")
          print()
          print("Per repository:")
          for name, row in p["repositories"].items():
              print(
                  f"- {name}: file {row['mean_file_recall']:.1%}, "
                  f"scoped {row['mean_symbol_recall_in_expected_files']:.1%}, "
                  f"qualified {row['mean_qualified_symbol_recall']:.1%}, "
                  f"identity {row['mean_symbol_identity_recall']:.1%}"
              )
          PY

      - name: Upload first-run result
        uses: actions/upload-artifact@v4
        with:
          name: fresh-holdout-12-result
          path: holdout-external-12.result.json
          if-no-files-found: error
          retention-days: 90
