name: Ranking Calibration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ranking-calibration.yml"
      - "scripts/collect_ranking_artifacts.py"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      artifact_limit:
        description: "Maximum recent PR ranking artifacts to inspect"
        required: false
        default: "50"

permissions:
  contents: read
  actions: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'

      - name: Resolve current frozen ground truth
        id: benchmark
        run: |
          hash="$(token-saver evaluate benchmarks/context-quality.json --print-ground-truth-hash)"
          echo "ground_truth_sha256=$hash" >> "$GITHUB_OUTPUT"

      - name: Collect recent PR ranking diffs
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_LIMIT: ${{ github.event.inputs.artifact_limit }}
        run: |
          python scripts/collect_ranking_artifacts.py \
            --limit "${ARTIFACT_LIMIT:-50}" \
            --out ranking-history \
            --selection-out selected-ranking-artifacts.json

      - name: Build current-cohort calibration
        env:
          GROUND_TRUTH_SHA: ${{ steps.benchmark.outputs.ground_truth_sha256 }}
        run: |
          token-saver ranking-calibrate ranking-history \
            --ground-truth-sha "$GROUND_TRUTH_SHA" \
            --min-reports 20 \
            --json > ranking-calibration.json
          token-saver ranking-calibrate ranking-history \
            --ground-truth-sha "$GROUND_TRUTH_SHA" \
            --min-reports 20 \
            --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: ranking-gate-calibration
          path: |
            ranking-calibration.json
            selected-ranking-artifacts.json
          if-no-files-found: error
          retention-days: 30
