name: Holdout External 4 First Run

on:
  pull_request:
    branches: [main]

jobs:
  frozen-holdout-4:
    if: github.event.pull_request.head.ref == 'test/holdout-external-4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/holdout-external-4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Token Saver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Verify frozen ground-truth hash before cloning
        run: |
          expected="73b66da6cc5b5595ee956154b8c05242a44b011e2d0bd22b3c86faa0278edb38"
          actual="$(token-saver evaluate benchmarks/holdout-external-4.json --print-ground-truth-hash)"
          test "$actual" = "$expected"

      - name: Clone pinned unseen repositories
        shell: bash
        run: |
          set -euo pipefail

          clone_at() {
            local url="$1"
            local dir="$2"
            local sha="$3"
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch -q --depth 1 origin "$sha"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          }

          clone_at https://github.com/pallets/jinja.git benchmarks/jinja 5ef70112a1ff19c05324ff889dd30405b1002044
          clone_at https://github.com/pallets/werkzeug.git benchmarks/werkzeug 6a604e005d95af8129ee314863be8ad6b240dead
          clone_at https://github.com/eslint/eslint.git benchmarks/eslint 92086c87e042413a3d0363d8fc3fbb11db98d06a
          clone_at https://github.com/nodejs/undici.git benchmarks/undici 4fb32a0eaf62e27fac3087abae9663696294043b
          clone_at https://github.com/gorilla/mux.git benchmarks/mux db9d1d0073d27a0a2d9a8c1bc52aa0af4374d265
          clone_at https://github.com/gin-gonic/gin.git benchmarks/gin 5c6a15f8f9566612076bd209e623861bf92a6283
          clone_at https://github.com/tokio-rs/axum.git benchmarks/axum 3f46d25e9274d485a99905d3734d37828112bc31
          clone_at https://github.com/serde-rs/json.git benchmarks/serde-json afdf6fc67247dd7fa4fcde1381e6ecc6bcc7a30e

      - name: Run frozen holdout exactly once
        run: |
          token-saver evaluate benchmarks/holdout-external-4.json \
            --path benchmarks \
            --max-tokens 6000 \
            --require-holdout | tee /tmp/holdout-external-4.result.json

      - name: Upload first-run result
        uses: actions/upload-artifact@v4
        with:
          name: holdout-external-4-first-run
          path: /tmp/holdout-external-4.result.json
