name: CI

on:
  # PR updates validate feature branches; main is revalidated after merge.
  # Avoid a second duplicate push run for branches that already have a PR.
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # Scoped to correctness rules, not formatting -- see [tool.ruff.lint]
      # in pyproject.toml for why E501/E701/E702/I are deliberately excluded.
      - run: ruff check src tests scripts
      - name: Enforce 100% docstring coverage
        run: interrogate src/token_saver
      # An invalid workflow expression is rejected by GitHub before any job
      # is created, so it shows up as a zero-second failure with no logs and
      # cannot be caught by any job running inside the workflow. release.yml
      # shipped broken exactly once this way (`secrets` used in a step-level
      # `if`, where that context is unavailable). Validate the workflows
      # themselves from a job that does run.
      - name: Lint GitHub Actions workflows
        run: |
          curl -sSLo actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf actionlint.tar.gz actionlint
          ./actionlint .github/workflows/*.yml

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: token-saver evaluate benchmarks/context-quality.json --path . --max-tokens 6000

  holdout:
    # The 25-task self-benchmark above is saturated at 100% and cannot detect
    # a ranking regression. This runs a real frozen external holdout against
    # pinned third-party repositories and enforces file, bare-symbol, and
    # expected-file-scoped symbol recall floors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Enforce frozen holdout regression floor
        run: python scripts/check_holdout.py benchmarks/holdout-external.floor.json
