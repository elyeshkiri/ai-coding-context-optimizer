name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Serialize release attempts so two close main pushes cannot race to reserve
# the same immutable version tag.
concurrency:
  group: token-saver-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not available directly in a step-level `if`.
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read package version
        id: package
        shell: bash
        run: |
          version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              project = tomllib.load(fh)["project"]
          print(project["version"])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Validate release provenance
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released; this workflow is a no-op until the package version changes."
            exit 0
          fi

          echo "release_needed=true" >> "$GITHUB_OUTPUT"
          if tag_sha="$(git rev-parse "$TAG^{commit}" 2>/dev/null)"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Version ${TAG#v} is already reserved by $TAG at $tag_sha, but this run is $GITHUB_SHA. Bump project.version before releasing."
              exit 1
            fi
            echo "$TAG already points at this exact commit; continuing a previous release attempt."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain missing PyPI credential
        if: steps.state.outputs.release_needed == 'true' && env.HAS_PYPI_TOKEN != 'true'
        run: |
          echo "::warning::PYPI_API_TOKEN is not configured; no tag, PyPI package, or GitHub release will be created."

      - name: Build wheel and source distribution
        if: steps.state.outputs.release_needed == 'true' && env.HAS_PYPI_TOKEN == 'true'
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate distribution metadata
        if: steps.state.outputs.release_needed == 'true' && env.HAS_PYPI_TOKEN == 'true'
        run: python -m twine check --strict dist/*

      # Reserve the version before publishing. If PyPI rejects the upload,
      # that version remains tied to this exact commit and the next attempt
      # must either retry this commit or bump the version.
      - name: Create version tag
        if: steps.state.outputs.release_needed == 'true' && env.HAS_PYPI_TOKEN == 'true' && steps.state.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      # PyPI is published before the GitHub release. If the upload fails, no
      # GitHub release is created. If upload succeeds but release creation
      # fails, skip-existing makes a retry safe while the tag pins provenance.
      - name: Publish to PyPI
        if: steps.state.outputs.release_needed == 'true' && env.HAS_PYPI_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create GitHub release
        if: steps.state.outputs.release_needed == 'true' && env.HAS_PYPI_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "$TAG" dist/*             --title "Token Saver $VERSION"             --generate-notes

      # Prefer PyPI Trusted Publishing over the long-lived API token once the
      # project exists. Configure claude-token-saver as a trusted publisher,
      # add `id-token: write`, and remove the explicit password above.
