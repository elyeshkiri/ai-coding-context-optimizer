name: Record Fresh Holdout 12 Result

on:
  push:
    branches:
      - bench/fresh-holdout-12-72

permissions:
  actions: read
  contents: write

jobs:
  record:
    if: contains(github.event.head_commit.message, '[record-holdout12]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench/fresh-holdout-12-72

      - name: Download immutable first-run artifact
        uses: actions/download-artifact@v4
        with:
          name: fresh-holdout-12-result
          path: imported
          run-id: 35442135225
          github-token: ${{ github.token }}

      - name: Verify artifact identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("imported/holdout-external-12.result.json").read_text())
          s = p["summary"]
          assert p["ground_truth_sha256"] == "625de623c409f6e77ac695612533f722330db3fd329dfc4b0eb82a0bb6994f54"
          assert p["holdout_protocol_enforced"] is True
          assert s["task_count"] == 72
          assert s["mean_file_recall"] == 1.0
          assert s["mean_symbol_recall"] == 1.0
          assert s["mean_symbol_recall_in_expected_files"] == 1.0
          assert s["mean_qualified_symbol_recall"] == 1.0
          assert s["mean_symbol_identity_recall"] == 1.0
          print(json.dumps(s, indent=2))
          PY

      - name: Record exact artifact
        run: |
          cp imported/holdout-external-12.result.json benchmarks/holdout-external-12.result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/holdout-external-12.result.json
          git commit -m "bench: record immutable 72-task fresh holdout 12 result"
          git push origin HEAD:bench/fresh-holdout-12-72
