name: Prior Semantic Win Diagnostics

on:
  push:
    branches:
      - feature/semantic-confidence-gate

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[diagnose-semantic-wins]')
    name: Diagnose prior semantic win / ${{ matrix.alias }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: 13
            alias: uvicorn
            manifest: benchmarks/semantic-holdout-13.frozen.json
            path: benchmarks/semantic-holdout-13/uvicorn
            url: https://github.com/Kludex/uvicorn.git
            revision: a56c7cce64aaa37e5864f882a5cbce8aa1dac47a
          - suite: 14
            alias: aspnetcore
            manifest: benchmarks/semantic-holdout-14.frozen.json
            path: benchmarks/semantic-holdout-14/aspnetcore
            url: https://github.com/dotnet/aspnetcore.git
            revision: 9817792d3ba9aa6f6c9ac5804a672ce5954f3288
    env:
      ACCO_STATE_DIR: /tmp/acco-semantic-win-diagnostic-${{ matrix.suite }}
      ACCO_SEMANTIC_MODEL_REVISION: bc57282bc374d33e0d6c4de27f12dc1c2a87f37a
      HF_HOME: /tmp/acco-huggingface-win-diagnostic

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02bd2dd6370847bcfe62b8988923b92af2d2f161
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-gate ACCO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,embeddings]'
          python -m pip uninstall -y hnswlib || true
      - name: Clone pinned repository
        shell: bash
        run: |
          set -euo pipefail
          path="${{ matrix.path }}"
          mkdir -p "$(dirname "$path")"
          git init -q "$path"
          git -C "$path" remote add origin "${{ matrix.url }}"
          git -C "$path" fetch -q --depth 1 origin "${{ matrix.revision }}"
          git -C "$path" checkout -q --detach "${{ matrix.revision }}"
      - name: Download pinned embedding model
        run: |
          python - <<'PY'
          import os
          from sentence_transformers import SentenceTransformer
          SentenceTransformer(
              "all-MiniLM-L6-v2",
              revision=os.environ["ACCO_SEMANTIC_MODEL_REVISION"],
          )
          PY
      - name: Capture pre-gate diagnostic
        run: |
          python scripts/diagnose_semantic_holdout.py \
            "${{ matrix.manifest }}" \
            --repository "${{ matrix.alias }}" \
            --output "semantic-win-${{ matrix.suite }}-${{ matrix.alias }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-win-${{ matrix.suite }}-${{ matrix.alias }}
          path: semantic-win-${{ matrix.suite }}-${{ matrix.alias }}.json
          retention-days: 30
          if-no-files-found: error

# Diagnostic-only workflow; results are burned-suite development evidence.\n# Triggered to inspect current-baseline rescue mechanics.
