name: Frozen Session-Efficiency Holdout

on:
  workflow_dispatch:
    inputs:
      confirm_paid_run:
        description: "Type RUN_SESSION_288 to confirm 144 arm-runs / 288 Claude task phases plus blind grading"
        required: true
        type: string
  push:
    branches:
      - bench/run-session-efficiency-24

permissions:
  contents: read

jobs:
  preflight:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_paid_run == 'RUN_SESSION_288') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-session-holdout]'))
    runs-on: ubuntu-latest
    env:
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID != '' }}
    outputs:
      tasks: ${{ steps.matrix.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Require paid-agent credentials
        run: |
          if [ "$HAS_ANTHROPIC_API_KEY" != "true" ]; then
            echo "::error::ANTHROPIC_API_KEY is required."
            exit 1
          fi
          if [ "$HAS_ANTHROPIC_WORKSPACE_ID" != "true" ]; then
            echo "::error::ANTHROPIC_WORKSPACE_ID is required."
            exit 1
          fi
      - name: Verify Docker
        run: docker version
      - name: Validate frozen session holdout before spending
        run: |
          acco session-holdout             benchmarks/session-efficiency-swebench-24.frozen.json             --out /tmp/session-runs.json             --dry-run > /tmp/session-schedule.json
          python - <<'PY'
          import json
          p = json.load(open("/tmp/session-schedule.json"))
          e = p["experiment"]
          assert p["comparison"]["baseline"] == "v1.6-session-baseline"
          assert p["comparison"]["treatment"] == "v1.7-session-efficiency"
          assert e["task_count"] == 24
          assert e["paired_trials"] == 72
          assert e["run_count"] == 144
          profiles = e["condition_profiles"]
          assert profiles["baseline"]["install_acco"] is True
          assert profiles["enabled"]["install_acco"] is True
          assert p["grader"]["judge"] == "claude-sonnet-5"
          print("frozen session schedule:", e["task_count"], "tasks,", e["run_count"], "arm-runs")
          PY
      - name: Build task matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open("benchmarks/session-efficiency-swebench-24.frozen.json"))
          print("tasks=" + json.dumps([t["id"] for t in p["tasks"]], separators=(",", ":")))
          PY

  smoke:
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      SMOKE_TASK: pytest-dev__pytest-5809
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Build pinned Claude Code image
        run: |
          docker build             -f benchmarks/e2e-agent.Dockerfile             -t acco-e2e-agent:2.1.276             .
      - name: Prepare smoke repository
        run: |
          python scripts/prepare_e2e_repos.py             benchmarks/session-efficiency-swebench-24.frozen.json             --task "$SMOKE_TASK"
      - name: Build nonpublishable one-task smoke suite
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path("benchmarks/session-efficiency-swebench-24.frozen.json")
          suite = json.loads(source.read_text(encoding="utf-8"))
          task_id = "pytest-dev__pytest-5809"
          task = next(task for task in suite["tasks"] if task["id"] == task_id)
          repo_id = task["repository"]
          suite["tasks"] = [task]
          suite["repositories"] = {repo_id: suite["repositories"][repo_id]}
          suite["design"]["trials_per_task"] = 1
          suite["protocol"]["task_definitions_frozen"] = False
          Path("benchmarks/session-efficiency-smoke.runtime.json").write_text(
              json.dumps(suite, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Execute two-arm two-phase paid smoke
        run: |
          mkdir -p results
          acco session-holdout             benchmarks/session-efficiency-smoke.runtime.json             --allow-development             --out results/smoke-runs.json             --report results/smoke-session-effectiveness.json             > results/smoke-summary.json
      - name: Require real continuity/control/quality/cost plumbing
        run: |
          python - <<'PY'
          import json
          runs = json.load(open("results/smoke-runs.json"))
          report = json.load(open("results/smoke-session-effectiveness.json"))
          assert len(runs["runs"]) == 2
          assert {r["condition"] for r in runs["runs"]} == {"baseline", "enabled"}
          assert all("quality" in run for run in runs["runs"])
          baseline = next(r for r in runs["runs"] if r["condition"] == "baseline")
          enabled = next(r for r in runs["runs"] if r["condition"] == "enabled")
          assert baseline["session_efficiency_telemetry"]["events"] == 0
          assert enabled["session_efficiency_telemetry"]["continuity_restores"] == 1
          assert baseline["session_metrics"]["tool_calls"] == baseline["tool_calls"]
          assert enabled["session_metrics"]["tool_calls"] == enabled["tool_calls"]
          assert report["conditions"]["baseline"]["cost_complete"] is True
          assert report["conditions"]["session-efficiency"]["cost_complete"] is True
          assert report["quality"]["blind_quality_verified"] is True
          print("paid smoke passed: two-phase agent, control isolation, continuity, blind quality, and pricing are usable")
          PY
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-efficiency-paid-smoke
          path: results/
          if-no-files-found: error
          retention-days: 30

  run-task:
    needs: [preflight, smoke]
    if: needs.preflight.result == 'success' && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 420
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        task: ${{ fromJson(needs.preflight.outputs.tasks) }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      TASK_ID: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Build pinned Claude Code image
        run: |
          docker build             -f benchmarks/e2e-agent.Dockerfile             -t acco-e2e-agent:2.1.276             .
      - name: Prepare only this frozen repository revision
        run: |
          python scripts/prepare_e2e_repos.py             benchmarks/session-efficiency-swebench-24.frozen.json             --task "$TASK_ID"
      - name: Execute three paired two-phase trials
        run: |
          mkdir -p results
          acco experiment             benchmarks/session-efficiency-swebench-24.frozen.json             --task "$TASK_ID"             --out "results/${TASK_ID}-runs.json"
      - name: Upload task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-e2e-${{ matrix.task }}
          path: results/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [preflight, smoke, run-task]
    if: needs.preflight.result == 'success' && needs.smoke.result == 'success' && needs.run-task.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Build pinned Claude grader image
        run: |
          docker build             -f benchmarks/e2e-agent.Dockerfile             -t acco-e2e-agent:2.1.276             .
      - name: Download all task evidence
        uses: actions/download-artifact@v4
        with:
          pattern: session-e2e-*
          path: collected
          merge-multiple: true
      - name: Merge exactly 144 frozen arm-runs
        run: |
          python scripts/merge_e2e_results.py             benchmarks/session-efficiency-swebench-24.frozen.json             collected/session-holdout-runs.json             collected/*-runs.json
      - name: Blind-grade all 72 paired final responses
        run: |
          acco blind-grade collected/session-holdout-runs.json             > collected/blind-grade-result.json
      - name: Evaluate session-efficiency outcomes
        run: |
          acco session-holdout-evaluate             collected/session-holdout-runs.json             --rates benchmarks/claude-sonnet-5-rates-2026-09-19.json             --json > collected/session-effectiveness.json
      - name: Write session-efficiency summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p = json.load(open("collected/session-effectiveness.json"))
          b = p["conditions"]["baseline"]
          e = p["conditions"]["session-efficiency"]
          r = p["reductions"]
          ci = p["bootstrap"]["intervals"]
          activation = p["feature_activation"]["treatment"]
          print("# Frozen session-efficiency holdout")
          print()
          print(f"- tasks: {p['tasks']}")
          print(f"- paired trials: {p['paired_trials']}")
          print(f"- baseline success: {b['success_rate']:.1%}")
          print(f"- treatment success: {e['success_rate']:.1%}")
          print(f"- tool calls: {b['tool_calls']} -> {e['tool_calls']} ({r['tool_calls']})")
          print(f"- input tokens: {b['input_tokens']} -> {e['input_tokens']} ({r['input_tokens']})")
          print(f"- retries: {b['retry_attempts']} -> {e['retry_attempts']} ({r['retry_attempts']})")
          print(f"- baseline cost/success: {b['cost_per_success_usd']}")
          print(f"- treatment cost/success: {e['cost_per_success_usd']}")
          print(f"- cost/success reduction: {r['cost_per_success']}")
          print(f"- tool-call CI95: {ci['tool_calls']}")
          print(f"- input-token CI95: {ci['input_tokens']}")
          print(f"- retry CI95: {ci['retry_attempts']}")
          print(f"- cost/success CI95: {ci['cost_per_success_usd']}")
          print(f"- continuity restores: {activation['totals']['continuity_restores']}")
          print(f"- dedup interventions: {activation['totals']['dedup_interventions']}")
          print(f"- waste signals: {activation['totals']['waste_signals']}")
          print(f"- blind quality verified: {p['quality']['blind_quality_verified']}")
          print(f"- publication gate: {p['publication_gate']['passed']}")
          print(f"- blockers: {p['publication_gate']['blockers']}")
          PY
      - name: Require publication gate
        run: |
          python - <<'PY'
          import json
          p = json.load(open("collected/session-effectiveness.json"))
          if not p["publication_gate"]["passed"]:
              raise SystemExit(
                  "session holdout not publishable: "
                  + ", ".join(p["publication_gate"]["blockers"])
              )
          PY
      - name: Upload merged session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-session-efficiency-24-aggregate
          path: collected/
          retention-days: 90
