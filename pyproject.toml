[project]
name = "claude-token-saver"
version = "1.14.0"
dependencies = ["tomli>=2; python_version < '3.11'", "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24", "tree-sitter-go>=0.25,<0.26", "tree-sitter-rust>=0.24,<0.25", "tree-sitter-java>=0.23,<0.24", "tree-sitter-c-sharp>=0.23,<0.24"]
description = "Compile coding tasks and patches into minimal evidence-complete context for AI agents."
keywords = ["token-optimization", "context-optimization", "ai-coding-agent", "mcp", "llm", "claude-code", "codex", "cursor", "opencode", "copilot", "developer-tools"]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "ruff==0.16.8", "interrogate>=1.7,<2"]
# provider-aware exact token counting: Anthropic API + OpenAI local tokenizer
exact = ["anthropic>=0.40", "tiktoken>=0.7,<1"]
google = ["google-genai>=1,<2"]
embeddings = ["sentence-transformers>=3,<6"]
semantic-ann = ["hnswlib>=0.8,<1"]
semantic = ["sentence-transformers>=3,<6", "hnswlib>=0.8,<1"]

[project.scripts]
token-saver = "token_saver.entry:main"
token-saver-pack = "token_saver.pack_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
token_saver = ["pricing_registry.json"]

[tool.setuptools.data-files]
"share/token-saver/benchmarks" = ["benchmarks/*.json"]
"share/token-saver/integrations" = ["integrations/*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Deliberately scoped to correctness, not formatting. This codebase uses a
# compact `if cond: raise ...` style (E701/E702) and long descriptive lines
# (E501) on purpose; flagging those would be 500+ diagnostics of pure noise
# and would train everyone to ignore the linter. Import ordering (I) is left
# alone for the same reason.
select = ["E9", "F", "B", "C4", "UP"]
ignore = [
    # zip(..., strict=) changes runtime behaviour on length mismatch rather
    # than just documenting intent, so it is not a safe blanket autofix here.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Tests build deliberately malformed sources as fixtures.
# dict(key=value) reads better than a literal for wide keyword-style fixtures.
"tests/*" = ["B018", "C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.interrogate]
fail-under = 100
verbose = 2
ignore-init-method = true
ignore-init-module = false
ignore-magic = true
ignore-nested-functions = true
