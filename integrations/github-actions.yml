name: ACCO validation

on:
  pull_request:

jobs:
  context-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: acco evaluate benchmarks/context-quality.json --path .
      - run: acco review . --base origin/${{ github.base_ref }} --json
