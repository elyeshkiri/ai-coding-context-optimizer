name: Release

on:
  push:
    branches:
      - main
  # Lets you publish a version whose GitHub release already exists (1.3.0 was
  # tagged and released before PyPI publishing was wired up) without inventing
  # an empty commit.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The `secrets` context is not available in a step-level `if`, only in
      # job-level `env`. Hoisting the presence check here keeps the publish
      # step skippable for forks without the secret; testing `secrets`
      # directly in the step condition makes the whole workflow file invalid,
      # so it fails to parse and never runs at all.
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; the GitHub release step will no-op."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Built unconditionally: the PyPI step below is gated on what PyPI
      # already has, not on what GitHub already has, so a version that was
      # released here before publishing existed can still reach PyPI.
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Token Saver $VERSION" \
            --generate-notes

      # skip-existing makes this idempotent: PyPI refuses re-uploads of a
      # version that is already published, and a re-run should be a no-op
      # rather than a red build. Publishing is irreversible -- a version
      # number on PyPI can be yanked but never reused -- so bump the version
      # in pyproject.toml for every release.
      #
      # Prefer Trusted Publishing over this long-lived token: configure the
      # repository as a trusted publisher at
      # https://pypi.org/manage/project/token-saver/settings/publishing/,
      # then delete the PYPI_API_TOKEN secret, add `id-token: write` to this
      # job's permissions, and drop the `password:` line below. That removes
      # the stored credential entirely.
      - name: Publish to PyPI
        if: env.HAS_PYPI_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
