name: Dapper Development Diagnostic

on:
  push:
    branches:
      - fix/overload-partial-class-ranking

jobs:
  dapper-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/overload-partial-class-ranking
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Clone pinned Dapper revision
        run: |
          git init -q /tmp/dapper
          git -C /tmp/dapper remote add origin https://github.com/DapperLib/Dapper.git
          git -C /tmp/dapper fetch -q --depth=1 origin 8becae8d0e2b360165ae03c0d5d1330b0273473d
          git -C /tmp/dapper checkout -q --detach FETCH_HEAD
      - name: Build development-only Dapper manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          frozen = json.loads(Path("benchmarks/holdout-external-7.json").read_text())
          dev = {
              "suite_version": 1,
              "max_tokens": frozen["max_tokens"],
              "repositories": {
                  "dapper": {
                      "path": "/tmp/dapper",
                      "revision": frozen["repositories"]["dapper"]["revision"],
                  }
              },
              "tasks": [
                  task for task in frozen["tasks"] if task["repository"] == "dapper"
              ],
          }
          Path("/tmp/dapper-dev.json").write_text(json.dumps(dev))
          PY
      - name: Run burned Dapper cases as development diagnostics only
        run: |
          echo "===== DAPPER_DEV_RESULT_BEGIN ====="
          token-saver evaluate /tmp/dapper-dev.json --path . --max-tokens 6000
          echo "===== DAPPER_DEV_RESULT_END ====="

      - name: Inspect failing Dapper rankings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from token_saver.pack import build_context_pack, rank_files
          from token_saver.repo_index import build_index

          frozen = json.loads(Path("benchmarks/holdout-external-7.json").read_text())
          tasks = [t for t in frozen["tasks"] if t["repository"] == "dapper"]
          root = Path("/tmp/dapper")
          index = build_index(root, persist=False)
          for task in tasks:
              if task["id"] not in {
                  "dapper-execute-sql",
                  "dapper-query-dynamic",
                  "dapper-queryfirst-generic",
                  "dapper-querysingle-type",
                  "dapper-queryasync-generic",
                  "dapper-executeasync-command",
                  "dapper-queryasync-multimap-two",
                  "dapper-queryasync-type-array",
              }:
                  continue
              print("\nTASK", task["id"], task["query"])
              ranked = rank_files(
                  root, task["query"], index=index, changed_boost=False,
                  feedback_boost=False,
              )
              for item in ranked[:8]:
                  print("RANK", round(item.score, 2), item.rel, item.reasons)
              pack = build_context_pack(
                  root, task["query"], max_tokens=6000,
                  changed_boost=False, feedback_boost=False,
                  persist_index=False, index=index,
              )
              print("FILES", pack.selected_files)
              print("IDENTITIES", pack.selected_symbol_identities)
          PY

      - name: Inspect overload signatures
        run: |
          python - <<'PY'
          from pathlib import Path
          from token_saver.repo_index import build_index
          from token_saver.pack import (
              _callable_signature_terms,
              _generic_arity,
              _query_generic_arity,
          )

          root = Path("/tmp/dapper")
          index = build_index(root, persist=False)
          record = index.records["Dapper/SqlMapper.Async.cs"]
          queries = {
              "generic": "which generic SqlMapper QueryAsync<T> overload asynchronously queries a SQL string into typed rows",
              "multi2": "which SqlMapper QueryAsync overload asynchronously multi maps two input types into a return type from a SQL string",
              "array": "which SqlMapper QueryAsync overload asynchronously multi maps a runtime Type array using an object array mapping function",
          }
          for symbol in record.definitions or []:
              if symbol.name not in {"QueryAsync", "ExecuteAsync", "QueryFirstAsync", "QuerySingleAsync", "ExecuteScalarAsync"}:
                  continue
              print(
                  "SYMBOL",
                  symbol.start_line,
                  symbol.qualified,
                  "ARITY", _generic_arity(symbol.signature, symbol.name),
                  "TERMS", sorted(_callable_signature_terms(symbol)),
                  "SIG", repr(symbol.signature),
              )
          for name, query in queries.items():
              print("QUERY_ARITY", name, _query_generic_arity(query, "QueryAsync"))
          PY
