[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "token-saver-fast"
version = "0.1.0"
description = "Optional Rust acceleration primitives for claude-token-saver"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.maturin]
module-name = "_token_saver_fast"
manifest-path = "Cargo.toml"
