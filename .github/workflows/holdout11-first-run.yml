name: Holdout 11 First Run

on:
  push:
    branches:
      - test/holdout-external-11
    paths:
      - benchmarks/holdout-external-11.json
      - .github/workflows/holdout11-first-run.yml

jobs:
  first-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/holdout-external-11

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen Token Saver revision
        run: python -m pip install -e '.[dev]'

      - name: Verify frozen ground truth before cloning repositories
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from token_saver.evaluate import ground_truth_hash
          payload = json.loads(Path("benchmarks/holdout-external-11.json").read_text())
          expected = payload["protocol"]["ground_truth_sha256"]
          actual = ground_truth_hash(payload)
          print("DECLARED", expected)
          print("ACTUAL  ", actual)
          assert actual == expected, (actual, expected)
          assert payload["protocol"]["ground_truth_frozen"] is True
          assert payload["protocol"]["development_excluded"] is True
          print("GROUND_TRUTH_VERIFIED")
          PY

      - name: Clone pinned untouched repositories
        run: |
          set -euo pipefail
          clone_at() {
            repo="$1"
            sha="$2"
            dest="$3"
            git init -q "$dest"
            git -C "$dest" remote add origin "https://github.com/$repo.git"
            git -C "$dest" fetch -q --depth=1 origin "$sha"
            git -C "$dest" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$sha"
          }
          clone_at dotnet/runtime a530ff2cdc5b7e8a50d49bd8b9d661db0155a2fc benchmarks/runtime
          clone_at dotnet/efcore be5ef4a52d88cabacdea656dac85024a2558482f benchmarks/efcore
          clone_at spring-projects/spring-framework b9fa06291846aa5ca5324e275c3ab263b30f02c2 benchmarks/spring-framework
          clone_at apache/httpcomponents-core e99e07816e96e2b6d1d8bb49f7baa9b36d86c873 benchmarks/httpcomponents-core
          clone_at reduxjs/redux-toolkit 70c8c630f3d5b45d77d18c3de417b96292759104 benchmarks/redux-toolkit
          clone_at vitest-dev/vitest a0a939653bc8441848579bb6ac18706372242cd6 benchmarks/vitest
          clone_at tokio-rs/tracing d9d4c542de10f5d3a711b7a45ffe450fd0666437 benchmarks/tracing
          clone_at redis/go-redis 7f3b3dffde59329db9fa7a71d650ef373affb599 benchmarks/go-redis
          clone_at grpc/grpc-go dd51b1c90aaf9b7ee0b07b1d14fa8e3a89132bef benchmarks/grpc-go
          clone_at sqlalchemy/sqlalchemy 4883307858ea3def775b5a1cc1c01a5be6dfe213 benchmarks/sqlalchemy

      - name: Run holdout exactly once
        run: |
          token-saver evaluate benchmarks/holdout-external-11.json \
            --path . \
            --max-tokens 6000 \
            --require-holdout > /tmp/holdout-external-11.result.json
          echo "===== HOLDOUT_11_RESULT_BEGIN ====="
          cat /tmp/holdout-external-11.result.json
          echo "===== HOLDOUT_11_RESULT_END ====="

      - uses: actions/upload-artifact@v4
        with:
          name: holdout-11-first-run
          path: /tmp/holdout-external-11.result.json
          if-no-files-found: error
