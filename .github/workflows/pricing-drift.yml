name: Pricing Registry Drift

on:
  pull_request:
    paths:
      - "src/token_saver/pricing.py"
      - "src/token_saver/pricing_registry.json"
      - "scripts/check_pricing_registry.py"
      - ".github/workflows/pricing-drift.yml"
      - "tests/test_pricing_registry.py"
  push:
    branches: [main]
    paths:
      - "src/token_saver/pricing.py"
      - "src/token_saver/pricing_registry.json"
      - "scripts/check_pricing_registry.py"
      - ".github/workflows/pricing-drift.yml"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Validate schema and freshness
        run: python scripts/check_pricing_registry.py --max-age-days 30
      - name: Compare live official pricing table
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/check_pricing_registry.py --max-age-days 30 --live
