name: Semantic Holdout 15 Diagnostics

on:
  push:
    branches:
      - feature/semantic-confidence-gate

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[diagnose-semantic-15]')
    name: Diagnose holdout 15 / ${{ matrix.alias }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - alias: werkzeug
            url: https://github.com/pallets/werkzeug.git
            revision: 015697636f6a0b89de7e8c1921e8fbe9940a8381
          - alias: chi
            url: https://github.com/go-chi/chi.git
            revision: 3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc
          - alias: axum
            url: https://github.com/tokio-rs/axum.git
            revision: 3696bfe5f1c30ee57f39dfb992b01bbf57bf2c1f
          - alias: gson
            url: https://github.com/google/gson.git
            revision: 854c8255b625cf1e13c701a83ea9ccb4caaa576a
          - alias: polly
            url: https://github.com/App-vNext/Polly.git
            revision: 9a81fdc7c1a89d6c45bba2fb7b062b8eeae39eee
          - alias: express
            url: https://github.com/expressjs/express.git
            revision: 9a34acf03cb818ff3f8bc40e44176e277a25cbb9
    env:
      ACCO_STATE_DIR: /tmp/acco-semantic-diagnostic-15-${{ matrix.alias }}
      ACCO_SEMANTIC_MODEL_REVISION: bc57282bc374d33e0d6c4de27f12dc1c2a87f37a
      HF_HOME: /tmp/acco-huggingface-diagnostic-15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACCO with exact-scan embeddings
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,embeddings]'
          python -m pip uninstall -y hnswlib || true

      - name: Validate exact-cosine backend
        run: |
          python - <<'PY'
          from acco.semantic_retrieval import _hnswlib
          assert _hnswlib() is None
          PY

      - name: Clone frozen repository
        shell: bash
        run: |
          set -euo pipefail
          path="benchmarks/semantic-holdout-15/${{ matrix.alias }}"
          mkdir -p "$(dirname "$path")"
          git init -q "$path"
          git -C "$path" remote add origin "${{ matrix.url }}"
          git -C "$path" fetch -q --depth 1 origin "${{ matrix.revision }}"
          git -C "$path" checkout -q --detach "${{ matrix.revision }}"

      - name: Download pinned embedding model
        run: |
          python - <<'PY'
          import os
          from sentence_transformers import SentenceTransformer
          SentenceTransformer(
              "all-MiniLM-L6-v2",
              revision=os.environ["ACCO_SEMANTIC_MODEL_REVISION"],
          )
          PY

      - name: Capture burned-suite ranking diagnostics
        run: |
          python scripts/diagnose_semantic_holdout.py \
            benchmarks/semantic-holdout-15.frozen.json \
            --repository "${{ matrix.alias }}" \
            --output "semantic-diagnostic-15-${{ matrix.alias }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: semantic-diagnostic-15-${{ matrix.alias }}
          path: semantic-diagnostic-15-${{ matrix.alias }}.json
          retention-days: 30
          if-no-files-found: error
