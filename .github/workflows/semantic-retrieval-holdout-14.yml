name: Semantic Retrieval Holdout 14

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_SEMANTIC_HOLDOUT_14 to burn the frozen suite"
        required: true
        type: string
  push:
    branches:
      - bench/run-semantic-holdout-14

permissions:
  contents: read

jobs:
  semantic-holdout:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_SEMANTIC_HOLDOUT_14') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-semantic-14]'))
    name: Frozen semantic holdout 14 / ${{ matrix.alias }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - alias: click
            url: https://github.com/pallets/click.git
            revision: 6aabf099bfdd4c1e75fe8d0e0d4241372b988ab1
          - alias: echo
            url: https://github.com/labstack/echo.git
            revision: 3d084be9022432c5a5257924c7d74bfc3444b456
          - alias: ripgrep
            url: https://github.com/BurntSushi/ripgrep.git
            revision: 3fce3b5bb0236da2df6d99672afb8a719642eca7
          - alias: mockito
            url: https://github.com/mockito/mockito.git
            revision: 9c5f36fb9f2ad89fbaab828d33d144cd398a4079
          - alias: vite
            url: https://github.com/vitejs/vite.git
            revision: e9078f865cdff6bed77cd729214a7e2868f126b5
          - alias: aspnetcore
            url: https://github.com/dotnet/aspnetcore.git
            revision: 9817792d3ba9aa6f6c9ac5804a672ce5954f3288
    env:
      ACCO_STATE_DIR: /tmp/acco-semantic-state-14-${{ matrix.alias }}
      ACCO_SEMANTIC_MODEL_REVISION: bc57282bc374d33e0d6c4de27f12dc1c2a87f37a
      HF_HOME: /tmp/acco-huggingface-14

    steps:
      - name: Require explicit burn confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirmation }}" != "RUN_SEMANTIC_HOLDOUT_14" ]; then
            echo "Refusing to burn semantic holdout 14 without exact confirmation." >&2
            exit 2
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACCO with exact-scan embeddings
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,embeddings]'

      - name: Require exact cosine evidence backend
        run: |
          python -m pip uninstall -y hnswlib || true
          python - <<'PY'
          from acco.semantic_retrieval import _hnswlib
          assert _hnswlib() is None, "semantic evidence must not use ANN"
          PY

      - name: Validate immutable query and ground-truth seals
        run: |
          python scripts/run_semantic_holdout.py \
            benchmarks/semantic-holdout-14.frozen.json \
            --validate-only

      - name: Clone pinned fresh repository
        shell: bash
        run: |
          set -euo pipefail
          path="benchmarks/semantic-holdout-14/${{ matrix.alias }}"
          mkdir -p "$(dirname "$path")"
          git init -q "$path"
          git -C "$path" remote add origin "${{ matrix.url }}"
          git -C "$path" fetch -q --depth 1 origin "${{ matrix.revision }}"
          git -C "$path" checkout -q --detach "${{ matrix.revision }}"

      - name: Download the pinned local embedding model
        run: |
          python - <<'PY'
          import os
          from sentence_transformers import SentenceTransformer

          model = SentenceTransformer(
              "all-MiniLM-L6-v2",
              revision=os.environ["ACCO_SEMANTIC_MODEL_REVISION"],
          )
          print(model)
          PY

      - name: Run frozen repository shard
        run: |
          python scripts/run_semantic_holdout.py \
            benchmarks/semantic-holdout-14.frozen.json \
            --repository "${{ matrix.alias }}" \
            --progress \
            --output "benchmarks/semantic-holdout-14.${{ matrix.alias }}.result.json"

      - uses: actions/upload-artifact@v4
        with:
          name: semantic-holdout-14-${{ matrix.alias }}
          path: benchmarks/semantic-holdout-14.${{ matrix.alias }}.result.json
          retention-days: 90
          if-no-files-found: error

  merge-semantic-holdout:
    name: Merge frozen semantic holdout 14
    needs: semantic-holdout
    if: ${{ always() && needs.semantic-holdout.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACCO
        run: python -m pip install -e .

      - name: Validate immutable query and ground-truth seals
        run: |
          python scripts/run_semantic_holdout.py \
            benchmarks/semantic-holdout-14.frozen.json \
            --validate-only

      - uses: actions/download-artifact@v4
        with:
          pattern: semantic-holdout-14-*
          path: partial-results
          merge-multiple: true

      - name: Merge repository shards
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find partial-results -type f -name '*.json' | sort)
          if [ "${#files[@]}" -ne 6 ]; then
            echo "Expected 6 repository result shards, found ${#files[@]}." >&2
            exit 2
          fi
          args=()
          for file in "${files[@]}"; do
            args+=(--merge-input "$file")
          done
          python scripts/run_semantic_holdout.py \
            benchmarks/semantic-holdout-14.frozen.json \
            "${args[@]}" \
            --output benchmarks/semantic-holdout-14.result.json

      - name: Publish literal benchmark summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result = json.loads(
              Path("benchmarks/semantic-holdout-14.result.json").read_text()
          )
          summary = result["summary"]
          print("# Semantic holdout 14")
          print()
          print(f"- eligible tasks: {summary['task_count']}")
          print(f"- lexical file recall: {summary['lexical_file_recall']:.2%}")
          print(f"- hybrid semantic file recall: {summary['semantic_file_recall']:.2%}")
          print(
              "- trivial lexical file recall: "
              f"{summary['trivial_lexical_file_recall']:.2%}"
          )
          print(
              "- semantic recall delta vs ACCO lexical: "
              f"{summary['semantic_file_recall_delta']:+.2%}"
          )
          print(
              "- semantic recovered/regressed tasks: "
              f"{summary['semantic_recovered_tasks']}/"
              f"{summary['semantic_regressed_tasks']}"
          )
          print(f"- lexical mean reduction: {summary['lexical_mean_token_reduction']:.2%}")
          print(f"- semantic mean reduction: {summary['semantic_mean_token_reduction']:.2%}")
          print()
          print(
              "This first completed run burns holdout 14 for tuning. "
              "No API-cost or task-success claim is implied."
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: semantic-holdout-14-first-complete-run
          path: benchmarks/semantic-holdout-14.result.json
          retention-days: 90
          if-no-files-found: error
