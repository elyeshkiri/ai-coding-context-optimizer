name: Burned Semantic Regression

on:
  push:
    branches:
      - feature/semantic-confidence-gate

permissions:
  contents: read

jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[burned-semantic-regression]')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          include = []
          for number in (13, 14, 15):
              manifest = Path(f"benchmarks/semantic-holdout-{number}.frozen.json")
              payload = json.loads(manifest.read_text())
              for alias, spec in payload["repositories"].items():
                  include.append({
                      "suite": number,
                      "manifest": str(manifest),
                      "alias": alias,
                      "path": str(Path("benchmarks") / spec["path"]),
                      "url": f"https://github.com/{spec['repository']}.git",
                      "revision": spec["revision"],
                  })
          print("value=" + json.dumps({"include": include}, separators=(",", ":")))
          PY

  evaluate:
    needs: prepare
    if: needs.prepare.result == 'success'
    name: Burned semantic ${{ matrix.suite }} / ${{ matrix.alias }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      ACCO_STATE_DIR: /tmp/acco-burned-semantic-${{ matrix.suite }}-${{ matrix.alias }}
      ACCO_SEMANTIC_MODEL_REVISION: bc57282bc374d33e0d6c4de27f12dc1c2a87f37a
      HF_HOME: /tmp/acco-huggingface-burned-semantic

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ACCO with exact-scan embeddings
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,embeddings]'
          python -m pip uninstall -y hnswlib || true

      - name: Require exact cosine
        run: |
          python - <<'PY'
          from acco.semantic_retrieval import _hnswlib
          assert _hnswlib() is None
          PY

      - name: Validate frozen manifest
        run: |
          python scripts/run_semantic_holdout.py "${{ matrix.manifest }}" --validate-only

      - name: Clone pinned repository
        shell: bash
        run: |
          set -euo pipefail
          path="${{ matrix.path }}"
          mkdir -p "$(dirname "$path")"
          git init -q "$path"
          git -C "$path" remote add origin "${{ matrix.url }}"
          git -C "$path" fetch -q --depth 1 origin "${{ matrix.revision }}"
          git -C "$path" checkout -q --detach "${{ matrix.revision }}"

      - name: Download pinned embedding model
        run: |
          python - <<'PY'
          import os
          from sentence_transformers import SentenceTransformer
          SentenceTransformer(
              "all-MiniLM-L6-v2",
              revision=os.environ["ACCO_SEMANTIC_MODEL_REVISION"],
          )
          PY

      - name: Evaluate burned repository shard
        run: |
          python scripts/run_semantic_holdout.py \
            "${{ matrix.manifest }}" \
            --repository "${{ matrix.alias }}" \
            --output "semantic-${{ matrix.suite }}-${{ matrix.alias }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: burned-semantic-${{ matrix.suite }}-${{ matrix.alias }}
          path: semantic-${{ matrix.suite }}-${{ matrix.alias }}.json
          retention-days: 30
          if-no-files-found: error

  merge:
    needs: evaluate
    if: ${{ always() && needs.evaluate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ACCO
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: burned-semantic-*
          path: partial-results
          merge-multiple: true
      - name: Merge burned suites
        shell: bash
        run: |
          set -euo pipefail
          for suite in 13 14 15; do
            mapfile -t files < <(find partial-results -type f -name "semantic-${suite}-*.json" | sort)
            if [ "${#files[@]}" -ne 6 ]; then
              echo "Expected six shards for semantic holdout ${suite}, got ${#files[@]}." >&2
              exit 2
            fi
            args=()
            for file in "${files[@]}"; do
              args+=(--merge-input "$file")
            done
            python scripts/run_semantic_holdout.py \
              "benchmarks/semantic-holdout-${suite}.frozen.json" \
              "${args[@]}" \
              --output "semantic-holdout-${suite}.development.json"
          done
      - name: Publish development comparison
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print("# Burned semantic regression — development evidence only")
          print()
          print("| Suite | Lexical | Semantic | Delta | Recovered | Regressed |")
          print("|---|---:|---:|---:|---:|---:|")
          for number in (13, 14, 15):
              data = json.loads(
                  Path(f"semantic-holdout-{number}.development.json").read_text()
              )
              s = data["summary"]
              print(
                  f"| #{number} | {s['lexical_file_recall']:.2%} | "
                  f"{s['semantic_file_recall']:.2%} | "
                  f"{s['semantic_file_recall_delta']:+.2%} | "
                  f"{s['semantic_recovered_tasks']} | "
                  f"{s['semantic_regressed_tasks']} |"
              )
          print()
          print(
              "All three suites are burned. These numbers are regression/"
              "development evidence, not fresh generalization evidence."
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: burned-semantic-confidence-gate-results
          path: semantic-holdout-*.development.json
          retention-days: 30
          if-no-files-found: error
